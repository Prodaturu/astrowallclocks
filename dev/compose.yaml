name: astrowallclocks-local

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: astrowallclocks_test
      MARIADB_USER: astro_local
      MARIADB_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in dev/.env}
      MARIADB_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:?Set LOCAL_DB_ROOT_PASSWORD in dev/.env}
    volumes:
      - local_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    environment: &wordpress_env
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: astrowallclocks_test
      WORDPRESS_DB_USER: astro_local
      WORDPRESS_DB_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in dev/.env}
      WORDPRESS_DEBUG: "1"
    ports:
      - "127.0.0.1:8088:80"
    volumes: &wordpress_volumes
      - local_wp:/var/www/html
      - ../theme:/var/www/html/wp-content/themes/astro-rebuild
      - ../site:/var/www/html/wp-content/themes/astro-rebuild/design:ro

  cli:
    image: wordpress:cli-php8.2
    user: "33:33"
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      <<: *wordpress_env
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes: *wordpress_volumes

volumes:
  local_db:
  local_wp:
